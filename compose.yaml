services:
  postgres:
    image: registry.example.com/platform/postgresql:18.6-rocky10.2
    restart: unless-stopped

    # Run as the baked-in postgres user instead of starting as root.
    # Only works when the volume is already owned by 999:999 — for a brand new
    # volume, start once without this line so the entrypoint can chown PGDATA.
    # user: "999:999"

    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      # Use a secret in production; POSTGRES_PASSWORD_FILE is supported.
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      # scram-sha-256 is already the default in 18; set explicitly so a future
      # base change can't silently weaken it.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256

    secrets:
      - pg_password

    volumes:
      # NOTE the 18+ layout: mount at /var/lib/postgresql, not .../data.
      # The ":Z" suffix is required on SELinux hosts for bind mounts.
      - pgdata18:/var/lib/postgresql
      - ./initdb.d:/docker-entrypoint-initdb.d:ro

    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200

    # SIGINT (the image's STOPSIGNAL) is a fast shutdown; give it room.
    stop_grace_period: 120s

    shm_size: 1gb          # /dev/shm default of 64m starves parallel workers
    ports:
      - "127.0.0.1:5432:5432"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  pgdata18:

secrets:
  pg_password:
    file: ./secrets/pg_password
